<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guestbook - Jerin Joseph</title>

<style>
body{
  margin:0;
  padding:60px 20px;
  font-family:"Inter","Segoe UI",sans-serif;
  background:#0f172a;
  color:#e2e8f0;
  animation:fadeIn 0.8s ease;
}

/* Fade animation */
@keyframes fadeIn{
  from{opacity:0; transform:translateY(15px);}
  to{opacity:1; transform:translateY(0);}
}

/* Back Button */
.back-btn{
  position:fixed;
  top:20px;
  left:20px;
  padding:10px 18px;
  border-radius:10px;
  background:linear-gradient(90deg,#3b82f6,#2563eb);
  color:white;
  text-decoration:none;
  font-size:14px;
  transition:0.3s;
  z-index:1000;
}

.back-btn:hover{
  transform:translateY(-3px);
  box-shadow:0 0 20px rgba(59,130,246,0.4);
}

/* Container */
.guestbook-container{
  max-width:700px;
  margin:auto;
  background:#1e293b;
  padding:40px;
  border-radius:20px;
  border:1px solid rgba(255,255,255,0.08);
  box-shadow:0 20px 50px rgba(0,0,0,0.5);
}

h1{
  text-align:center;
  margin-bottom:10px;
  background:linear-gradient(90deg,#3b82f6,#60a5fa);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.subtitle{
  text-align:center;
  color:#94a3b8;
  margin-bottom:30px;
}

/* Form */
form{
  display:flex;
  flex-direction:column;
  gap:15px;
}

input, textarea{
  padding:12px 15px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.1);
  background:#0f172a;
  color:white;
  font-size:14px;
  outline:none;
  transition:0.3s;
}

input:focus, textarea:focus{
  border:1px solid #3b82f6;
  box-shadow:0 0 10px rgba(59,130,246,0.4);
}

textarea{
  resize:none;
  min-height:100px;
}

button{
  padding:12px;
  border:none;
  border-radius:12px;
  background:linear-gradient(90deg,#3b82f6,#2563eb);
  color:white;
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:translateY(-3px);
  box-shadow:0 0 20px rgba(59,130,246,0.4);
}

h2{
  margin-top:40px;
  color:#60a5fa;
}

/* Messages */
.message{
  background:#0f172a;
  padding:15px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.08);
  margin-bottom:15px;
}

.message strong{
  color:#3b82f6;
}

.time{
  font-size:12px;
  color:#94a3b8;
  margin-top:5px;
}
</style>
</head>

<body>

<a href="../index.html" class="back-btn">⬅ Back</a>

<div class="guestbook-container">

<h1>Guestbook</h1>
<p class="subtitle">Leave your thoughts, wishes, or just say hello!</p>

<form name="guestbook" method="POST" data-netlify="true" action="/thank-you.html">
  <input type="hidden" name="form-name" value="guestbook">
  <input type="text" name="name" placeholder="👤 Your Name" required>
  <textarea name="message" placeholder="💬 Your Message" required></textarea>
  <button type="submit">Send Message</button>
</form>

<h2>Guestbook Messages</h2>
<div id="messages"><p>Loading messages...</p></div>

</div>

<script>
const container = document.getElementById("messages");

async function loadMessages() {
  try {
    const res = await fetch("/.netlify/functions/get-guestbook");
    if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);

    const messages = await res.json();
    container.innerHTML = "";

    if (messages.length === 0) {
      container.innerHTML = "<p>No messages yet. Be the first to sign! 🎉</p>";
      return;
    }

    messages.reverse().forEach(msg => {
      const date = new Date(msg.created_at);
      const formattedDate = date.toLocaleString();

      const div = document.createElement("div");
      div.className = "message";
      div.innerHTML = `
        <p><strong>${msg.data.name}</strong> says:</p>
        <p>${msg.data.message}</p>
        <p class="time">${formattedDate}</p>
      `;
      container.appendChild(div);
    });

  } catch (err) {
    container.innerHTML = `<p>Failed to load messages: ${err.message}</p>`;
  }
}

loadMessages();
</script>

</body>
</html>
