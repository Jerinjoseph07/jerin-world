<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaming Dashboard - Jerin Joseph</title>

<style>
body{
  margin:0;
  padding:50px 20px;
  font-family:"Inter","Segoe UI",sans-serif;
  background:#0f172a;
  color:#e2e8f0;
}

/* ===== Heading ===== */
h1{
  text-align:center;
  margin-bottom:30px;
  font-size:28px;
  background:linear-gradient(90deg,#3b82f6,#60a5fa);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* ===== Filter Buttons ===== */
.filters{
  text-align:center;
  margin-bottom:30px;
}

.filter-btn{
  padding:8px 16px;
  margin:5px;
  border-radius:8px;
  border:none;
  cursor:pointer;
  background:#1e293b;
  color:#cbd5e1;
  transition:0.3s;
}

.filter-btn:hover,
.filter-btn.active{
  background:#3b82f6;
  color:white;
}

/* ===== Game Grid ===== */
.games-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:25px;
  max-width:1200px;
  margin:auto;
}

.game-card{
  background:#1e293b;
  border-radius:18px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,0.08);
  transition:0.4s ease;
}

.game-card:hover{
  transform:translateY(-8px);
  box-shadow:0 20px 40px rgba(59,130,246,0.4);
}

/* Cover Image */
.game-card img{
  width:100%;
  height:300px;
  object-fit:cover;
}

/* Game Content */
.game-content{
  padding:18px;
}

.game-content h3{
  margin:0 0 8px 0;
  color:#60a5fa;
  font-size:17px;
}

/* Rating */
.rating{
  color:#facc15;
  margin-bottom:12px;
}

/* Progress Bar */
.progress{
  background:#0f172a;
  border-radius:10px;
  overflow:hidden;
  height:10px;
}

.progress-bar{
  height:10px;
  background:linear-gradient(90deg,#3b82f6,#60a5fa);
  width:0;
  transition:width 1.5s ease;
}

/* ===== Statistics Dashboard ===== */
.stats{
  max-width:1000px;
  margin:60px auto 20px;
  display:flex;
  justify-content:space-around;
  flex-wrap:wrap;
  gap:25px;
}

.stat-box{
  background:#1e293b;
  padding:25px;
  border-radius:16px;
  text-align:center;
  border:1px solid rgba(255,255,255,0.1);
  min-width:200px;
}

.stat-box h2{
  margin:0;
  font-size:26px;
  color:#3b82f6;
}

.stat-box p{
  margin-top:8px;
  color:#94a3b8;
}

/* Back Button */
.back-container{
  text-align:center;
  margin-top:40px;
}

.back-btn{
  padding:12px 20px;
  border-radius:12px;
  background:linear-gradient(90deg,#3b82f6,#2563eb);
  color:white;
  text-decoration:none;
  transition:0.3s;
}

.back-btn:hover{
  transform:translateY(-3px);
  box-shadow:0 0 20px rgba(59,130,246,0.4);
}
</style>
</head>

<body>

<h1>Gaming Dashboard</h1>

<div class="filters">
  <button class="filter-btn active" onclick="filterGames('all',this)">All</button>
  <button class="filter-btn" onclick="filterGames('pc',this)">PC</button>
  <button class="filter-btn" onclick="filterGames('mobile',this)">Mobile</button>
</div>

<div class="games-grid">

  <div class="game-card" data-platform="pc">
    <img src="../images/games/minecraft.jpg" alt="Minecraft Cover">
    <div class="game-content">
      <h3>Minecraft</h3>
      <div class="rating">⭐⭐⭐⭐⭐</div>
      <div class="progress"><div class="progress-bar" data-play="90%"></div></div>
    </div>
  </div>

  <div class="game-card" data-platform="pc">
    <img src="../images/games/nfs.jpg" alt="Need for Speed Cover">
    <div class="game-content">
      <h3>Need for Speed</h3>
      <div class="rating">⭐⭐⭐⭐</div>
      <div class="progress"><div class="progress-bar" data-play="75%"></div></div>
    </div>
  </div>

  <div class="game-card" data-platform="pc">
    <img src="../images/games/gta4.jpg" alt="GTA 4 Cover">
    <div class="game-content">
      <h3>GTA 4</h3>
      <div class="rating">⭐⭐⭐⭐⭐</div>
      <div class="progress"><div class="progress-bar" data-play="85%"></div></div>
    </div>
  </div>

  <div class="game-card" data-platform="pc">
    <img src="../images/games/assassinscreed.jpg" alt="Assassin's Creed Cover">
    <div class="game-content">
      <h3>Assassin’s Creed</h3>
      <div class="rating">⭐⭐⭐⭐</div>
      <div class="progress"><div class="progress-bar" data-play="70%"></div></div>
    </div>
  </div>

  <div class="game-card" data-platform="mobile">
    <img src="../images/games/codmobile.jpg" alt="Call of Duty Mobile Cover">
    <div class="game-content">
      <h3>Call of Duty Mobile</h3>
      <div class="rating">⭐⭐⭐⭐</div>
      <div class="progress"><div class="progress-bar" data-play="80%"></div></div>
    </div>
  </div>

  <div class="game-card" data-platform="mobile">
    <img src="../images/games/pubgmobile.jpg" alt="PUBG Mobile Cover">
    <div class="game-content">
      <h3>PUBG Mobile</h3>
      <div class="rating">⭐⭐⭐⭐</div>
      <div class="progress"><div class="progress-bar" data-play="85%"></div></div>
    </div>
  </div>

  <div class="game-card" data-platform="mobile">
    <img src="../images/games/coc.jpg" alt="Clash of Clans Cover">
    <div class="game-content">
      <h3>Clash of Clans</h3>
      <div class="rating">⭐⭐⭐⭐</div>
      <div class="progress"><div class="progress-bar" data-play="65%"></div></div>
    </div>
  </div>

</div>

<!-- Statistics -->
<div class="stats">
  <div class="stat-box">
    <h2>7+</h2>
    <p>Total Games</p>
  </div>
  <div class="stat-box">
    <h2>PC & Mobile</h2>
    <p>Platforms</p>
  </div>
  <div class="stat-box">
    <h2>High Activity</h2>
    <p>Gaming Status</p>
  </div>
</div>

<div class="back-container">
  <a href="../index.html" class="back-btn">⬅ Back to Main Page</a>
</div>

<script>
function filterGames(type,btn){
  document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");

  document.querySelectorAll(".game-card").forEach(card=>{
    if(type==="all" || card.dataset.platform===type){
      card.style.display="block";
    }else{
      card.style.display="none";
    }
  });
}

window.onload = function(){
  document.querySelectorAll(".progress-bar").forEach(bar=>{
    bar.style.width = bar.dataset.play;
  });
};
</script>

</body>
</html>
