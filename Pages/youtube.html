<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube - Jerin Joseph</title>

<style>
body{
  margin:0;
  padding:50px 20px;
  font-family:"Inter","Segoe UI",sans-serif;
  background:#0f172a;
  color:#e2e8f0;
  text-align:center;
  animation:fadeIn 1s ease;
}

/* Fade animation */
@keyframes fadeIn{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

h1{
  font-size:30px;
  margin-bottom:30px;
  background:linear-gradient(90deg,#3b82f6,#60a5fa);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* ===== Back Button ===== */
.back-btn{
  position:fixed;
  top:20px;
  left:20px;
  padding:10px 18px;
  border-radius:10px;
  background:linear-gradient(90deg,#3b82f6,#2563eb);
  color:white;
  text-decoration:none;
  font-size:14px;
  transition:0.3s ease;
  z-index:1000;
}

.back-btn:hover{
  transform:translateY(-3px);
  box-shadow:0 0 20px rgba(59,130,246,0.4);
}

/* Channel Card */
.channel-card{
  max-width:900px;
  margin:0 auto 30px auto;
  background:#1e293b;
  padding:30px;
  border-radius:18px;
  border:1px solid rgba(255,255,255,0.1);
  box-shadow:0 15px 40px rgba(0,0,0,0.5);
}

/* Stats */
.stats{
  display:flex;
  justify-content:center;
  gap:40px;
  margin-top:20px;
  flex-wrap:wrap;
}

.stat-box{
  background:#0f172a;
  padding:15px 25px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.1);
}

.stat-box h3{
  margin:0;
  font-size:22px;
  color:#60a5fa;
}

.stat-box p{
  margin:5px 0 0;
  font-size:13px;
  color:#94a3b8;
}

/* Video Grid */
.video-grid{
  max-width:1100px;
  margin:40px auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:20px;
}

.video-wrapper{
  position:relative;
  padding-bottom:56.25%;
  height:0;
  overflow:hidden;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,0.5);
  transition:0.4s ease;
}

.video-wrapper iframe{
  position:absolute;
  width:100%;
  height:100%;
  border:none;
}

.video-wrapper:hover{
  transform:scale(1.05);
  box-shadow:0 15px 40px rgba(59,130,246,0.4);
}

/* Subscribe Button */
.subscribe-btn{
  display:inline-block;
  margin-top:20px;
  padding:12px 24px;
  border-radius:10px;
  background:linear-gradient(90deg,#ef4444,#dc2626);
  color:white;
  text-decoration:none;
  font-weight:600;
  transition:0.3s;
}

.subscribe-btn:hover{
  transform:translateY(-3px);
  box-shadow:0 0 20px rgba(239,68,68,0.5);
}
</style>
</head>

<body>

<!-- Back Button -->
<a href="../index.html" class="back-btn">⬅ Back</a>

<h1>SuddenThings YouTube Channel</h1>

<div class="channel-card">
  <h2>About The Channel</h2>
  <p>
    SuddenThings is a creative space focused on unexpected,
    entertaining and unique content.
  </p>

  <div class="stats">
    <div class="stat-box">
      <h3 id="subCount">Loading...</h3>
      <p>Subscribers</p>
    </div>

    <div class="stat-box">
      <h3>Growing</h3>
      <p>Channel Status</p>
    </div>

    <div class="stat-box">
      <h3>Active</h3>
      <p>Content Uploading</p>
    </div>
  </div>

  <a href="https://youtube.com/@suddenthings" target="_blank" class="subscribe-btn">
    🔔 Subscribe Now
  </a>
</div>

<h2>Latest Videos</h2>

<div class="video-grid">

  <div class="video-wrapper">
    <iframe src="https://www.youtube.com/embed/videoseries?list=UU_CHANNEL_ID"
      allowfullscreen>
    </iframe>
  </div>

  <div class="video-wrapper">
    <iframe src="https://www.youtube.com/embed/DVvzQ77CQsc"
      allowfullscreen>
    </iframe>
  </div>

</div>

<script>
/* Fake subscriber animation */
let fakeSubs = 1250;
setInterval(()=>{
  fakeSubs += Math.floor(Math.random()*2);
  document.getElementById("subCount").innerText = fakeSubs.toLocaleString();
},2000);
</script>

</body>
</html>
