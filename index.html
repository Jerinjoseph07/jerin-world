  <div class="main-body">

    <div class="left-column">

      <div class="profile-card">

        <ul>
          <li><a href="./Pages/Home.html" target="content-frame" class="active-link">Home</a></li>

        src="./Pages/Home.html"

  <!-- ✅ Script moved here -->
  <script>
    const links = document.querySelectorAll(".profile-card a[target='content-frame']");
    const iframe = document.querySelector("iframe[name='content-frame']");

    links.forEach(link => {
      link.addEventListener("click", function() {

        // Remove previous active
        links.forEach(l => l.classList.remove("active-link"));

        // Add active class
        this.classList.add("active-link");

        // Fade effect
        iframe.classList.add("fade");
        setTimeout(() => {
          iframe.classList.remove("fade");
        }, 400);
      });
    });
  </script>
